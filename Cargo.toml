[package]
name = "checkspan"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Work you can verify: a DAG of immutable contracts, candidate artifacts, verifier receipts, and human decisions."
repository = "https://github.com/USS-Parks/Checkspan"
publish = false
# examples/ holds JSON documents for the CLI, not Rust example binaries.
autoexamples = false

[lib]
name = "checkspan"
path = "src/lib.rs"

[[bin]]
name = "checkspan"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
jsonschema = { version = "0.54.0", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11.0"

[lints.rust]
unsafe_code = "forbid"
