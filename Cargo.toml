[package]
name = "checkspan"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Work you can verify: a DAG of immutable contracts, candidate artifacts, verifier receipts, and human decisions."
repository = "https://github.com/USS-Parks/Checkspan"
publish = false

[lib]
name = "checkspan"
path = "src/lib.rs"

[[bin]]
name = "checkspan"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
jsonschema = { version = "0.54.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
